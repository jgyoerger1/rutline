<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rutline search results art</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }
  :root { --bg: #0f1311; --bone: #f2ede2; --bone-2: #c9c3b6; --ember: #e8702c; }
  * { box-sizing: border-box; margin: 0; }
  /* 3840 x 2560 (3:2) at 2x. Apple's safe area: x 418-1502, y 382-897 in these px */
  html, body { width: 1920px; height: 1280px; background: var(--bg); overflow: hidden; }
  .art { position: relative; width: 1920px; height: 1280px; overflow: hidden; }
  .map { position: absolute; inset: 0; background: center / cover no-repeat; filter: saturate(0.6) brightness(0.4); }
  .shade { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgba(15,19,17,0.92) 0px, rgba(15,19,17,0.8) 900px, rgba(15,19,17,0.35) 1300px, rgba(15,19,17,0.6) 1920px); }
  .text { position: absolute; left: 430px; width: 500px; top: 382px; height: 515px; display: flex; flex-direction: column; justify-content: center; }
  .tag { font: 600 20px/1 'Geist Mono', monospace; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ember); }
  h1 { margin-top: 22px; font: 650 74px/1.02 'Geist', sans-serif; letter-spacing: -0.025em; color: var(--bone); }
  .list { margin-top: 30px; display: grid; gap: 13px; list-style: none; padding: 0; }
  .list li { display: flex; align-items: center; gap: 16px; font: 500 27px/1.1 'Geist', sans-serif; color: var(--bone-2); white-space: nowrap; }
  .list li::before { content: ''; width: 18px; height: 3px; border-radius: 2px; background: var(--ember); flex: none; }
  .phone { position: absolute; width: 318px; aspect-ratio: 1320 / 2868; border-radius: 46px; padding: 9px; background: #1b1f1d;
      box-shadow: 0 0 0 1.5px #343a37, 0 40px 90px rgba(0,0,0,0.6); }
  .phone img { display: block; width: 100%; height: 100%; border-radius: 38px; }
  .p1 { left: 966px; top: 300px; }
  .p2 { left: 1220px; top: 356px; }
  .credit { position: absolute; right: 18px; bottom: 12px; font: 500 11px/1 'Geist', sans-serif; color: rgba(242,237,226,0.4); }
</style>
</head>
<body>
  <div class="art">
    <div class="map"></div>
    <div class="shade"></div>
    <div class="text">
      <div class="tag">Map. Predict. Track.</div>
      <h1>See whose land you're on.</h1>
      <ul class="list">
        <li>Property lines and owners</li>
        <li>Live wind and scent</li>
        <li>Rut movement forecast</li>
      </ul>
    </div>
    <div class="phone p1"><img src="../store/screenshots/6.9/01-map.png" alt=""></div>
    <div class="phone p2"><img src="../store/screenshots/6.9/02-parcel-owner.png" alt=""></div>
    <div class="credit">Imagery: Esri, Maxar, Earthstar Geographics</div>
  </div>
</body>
</html>
