<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rutline link preview</title>
<style>
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; src: url('../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }
  :root { --bg: #0f1311; --bone: #f2ede2; --bone-2: #c9c3b6; --ember: #e8702c; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  /* Buck on the left, cropped to keep the stray phone edge in the source art out of frame */
  .buck { position: absolute; left: -40px; top: -48px; width: 700px; height: 700px; background: url('../public/brand/hero-buck.jpg') left top / 700px 700px no-repeat; }
  .fade { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgba(15,19,17,0) 0px, rgba(15,19,17,0) 330px, rgba(15,19,17,0.82) 520px, var(--bg) 610px),
      linear-gradient(0deg, rgba(15,19,17,0.55) 0px, rgba(15,19,17,0) 140px); }
  .text { position: absolute; left: 600px; right: 60px; top: 70px; bottom: 58px; display: flex; flex-direction: column; }
  .mark { font: 700 84px/0.9 'Chakra Petch', sans-serif; letter-spacing: 0.035em; color: var(--bone); }
  .mark b { color: var(--ember); font-weight: 700; }
  .tag { margin-top: 16px; font: 600 21px/1 'Geist Mono', monospace; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ember); }
  .list { margin-top: 34px; display: grid; gap: 13px; list-style: none; padding: 0; }
  .list li { display: flex; align-items: center; gap: 16px; font: 500 26px/1.1 'Geist', sans-serif; color: var(--bone); letter-spacing: -0.005em; white-space: nowrap; }
  .list li::before { content: ''; width: 18px; height: 3px; border-radius: 2px; background: var(--ember); flex: none; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 16px; }
  .free { font: 700 20px/1 'Geist', sans-serif; letter-spacing: 0.12em; color: #160d06; background: var(--ember); border-radius: 999px; padding: 9px 16px 8px; }
  .url { font: 500 20px/1 'Geist Mono', monospace; color: var(--bone-2); }
</style>
</head>
<body>
  <div class="card">
    <div class="buck"></div>
    <div class="fade"></div>
    <div class="text">
      <div class="mark">RUT<b>LINE</b></div>
      <div class="tag">Map. Predict. Track.</div>
      <ul class="list">
        <li>Property lines &amp; landowners</li>
        <li>Permission letters written for you</li>
        <li>LiDAR terrain maps</li>
        <li>Wind, scent &amp; rut forecast</li>
        <li>Blood-trail camera</li>
        <li>Field dressing &amp; tracking guides</li>
      </ul>
      <div class="foot"><span class="free">FREE</span><span class="url">jordanyoerger.com/rutline</span></div>
    </div>
  </div>
</body>
</html>
