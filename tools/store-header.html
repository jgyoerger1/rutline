<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rutline product page header</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); }
  :root { --bg: #0f1311; --bone: #f2ede2; --bone-2: #c9c3b6; --ember: #e8702c; }
  * { box-sizing: border-box; margin: 0; }
  /* 3840 x 1646 (21:9) at 2x. Apple's safe area: x 548-1372, y 246-577 in these px */
  html, body { width: 1920px; height: 823px; background: var(--bg); overflow: hidden; }
  .art { position: relative; width: 1920px; height: 823px; overflow: hidden; }
  /* Live app map (satellite, property lines, pins, trail), injected by store-art.mjs */
  .map { position: absolute; inset: 0; background: center / cover no-repeat; filter: saturate(0.7) brightness(0.62); }
  .shade { position: absolute; inset: 0; background:
      radial-gradient(ellipse 720px 330px at 1000px 420px, rgba(15,19,17,0.94), rgba(15,19,17,0.8) 55%, rgba(15,19,17,0) 100%),
      linear-gradient(180deg, rgba(15,19,17,0.7) 0px, rgba(15,19,17,0) 170px),
      linear-gradient(0deg, rgba(15,19,17,0.75) 0px, rgba(15,19,17,0) 200px),
      linear-gradient(90deg, rgba(15,19,17,0.9) 0px, rgba(15,19,17,0.2) 520px, rgba(15,19,17,0) 760px); }
  /* Buck on the left, facing the headline; the mask drops the stray phone edge in the source art */
  .buck { position: absolute; left: -110px; top: -70px; width: 960px; height: 960px;
      background: url('../public/brand/hero-buck.jpg') center / cover no-repeat;
      -webkit-mask-image: linear-gradient(90deg, #000 38%, transparent 78%), linear-gradient(0deg, transparent 0, #000 22%);
      -webkit-mask-composite: source-in; mask-composite: intersect; }
  .text { position: absolute; left: 560px; width: 860px; top: 246px; height: 331px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .tag { font: 600 20px/1 'Geist Mono', monospace; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ember); }
  h1 { margin-top: 22px; font: 650 76px/1.02 'Geist', sans-serif; letter-spacing: -0.025em; color: var(--bone); }
  .sub { margin-top: 22px; font: 450 25px/1.3 'Geist', sans-serif; color: var(--bone-2); }
  .credit { position: absolute; right: 18px; bottom: 12px; font: 500 11px/1 'Geist', sans-serif; color: rgba(242,237,226,0.4); }
</style>
</head>
<body>
  <div class="art">
    <div class="map"></div>
    <div class="shade"></div>
    <div class="buck"></div>
    <div class="text">
      <div class="tag">Map. Predict. Track.</div>
      <h1>Know the ground<br>before you hunt it.</h1>
      <p class="sub">Property lines, wind and the rut on one map.</p>
    </div>
    <div class="credit">Imagery: Esri, Maxar, Earthstar Geographics</div>
  </div>
</body>
</html>
